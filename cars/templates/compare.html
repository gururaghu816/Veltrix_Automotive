{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compare Cars — Veltrix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --bg-2:#141414; --card:#161616; --line:#2a2a2a;
    --text:#f5f5f5; --muted:#9a9a9a; --accent:#ff4433; --accent-glow:rgba(255,68,51,0.35);
    --ok:#3ddc84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  .navbar{ display:flex;align-items:center;justify-content:space-between; padding:22px 48px;background:#000;border-bottom:1px solid #1a1a1a; }
  .navbar .logo{ font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;letter-spacing:0.04em; }
  .navbar .nav-links{ display:flex;gap:34px; }
  .navbar .nav-links a{ color:#e8e8e8;text-decoration:none;font-size:15px; }
  .navbar .nav-links a:hover{ color:var(--accent); }
  .navbar .btn-logout{ background:var(--accent);color:#0a0a0a;padding:10px 22px;border-radius:999px;font-weight:700;text-decoration:none;font-size:14px; }
  @media (max-width:760px){ .navbar .nav-links{display:none;} }

  .page{
    padding:56px 24px 90px;
    background:radial-gradient(ellipse 900px 420px at 50% 0%, var(--accent-glow) 0%, transparent 60%), var(--bg);
    min-height:calc(100vh - 73px);
  }

  .header{ text-align:center; max-width:520px; margin:0 auto 40px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.24em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
  h1{ font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(26px,4.2vw,38px); text-transform:uppercase; margin:0 0 10px; line-height:1.1; }
  .header p{ color:var(--muted); font-size:14.5px; margin:0; line-height:1.6; }

  /* ---- Picker row ---- */
  .picker-row{
    display:flex; align-items:center; justify-content:center; gap:20px;
    max-width:820px; margin:0 auto 36px; flex-wrap:wrap;
  }
  .picker{
    flex:1; min-width:240px; max-width:340px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px;
  }
  .picker label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;
  }
  .picker select{
    width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px;
    outline:none; appearance:none; -webkit-appearance:none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:38px;
    transition:border-color .18s ease;
  }
  .picker select:focus{ border-color:var(--accent); }

  .vs-badge{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:800; font-size:14px;
    flex-shrink:0; box-shadow:0 0 24px var(--accent-glow);
  }

  .compare-btn-row{ text-align:center; margin-bottom:48px; }
  .compare-btn{
    background:var(--accent); color:#0a0a0a; border:none; border-radius:999px;
    padding:14px 38px; font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
    transition:background .18s ease, transform .12s ease;
  }
  .compare-btn:hover{ background:#ff5c47; }
  .compare-btn:active{ transform:scale(0.98); }
  .compare-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---- Result cards ---- */
  .result-wrap{ max-width:820px; margin:0 auto; display:none; }
  .result-wrap.show{ display:block; }

  .cars-header{
    display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:4px;
  }
  .car-head{
    background:var(--card); border:1px solid var(--line); border-radius:14px 14px 0 0;
    padding:24px 20px; text-align:center; border-bottom:none;
  }
  .car-head .thumb{
    width:64px; height:64px; margin:0 auto 12px; border-radius:12px;
    background:linear-gradient(160deg,#232323,#101010);
    display:flex; align-items:center; justify-content:center;
  }
  .car-head .thumb svg{ width:36px; height:36px; color:var(--accent); }
  .car-head .brand{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .car-head .name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:18px; }

  .spec-table{
    background:var(--card); border:1px solid var(--line); border-radius:0 0 14px 14px;
    overflow:hidden;
  }
  .spec-row{
    display:grid; grid-template-columns:1fr 1fr;
    border-top:1px solid var(--line);
  }
  .spec-row:first-child{ border-top:none; }
  .spec-label-row{
    padding:10px 20px 0;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--muted); grid-column:1/-1;
  }
  .spec-cell{
    padding:8px 20px 16px; font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:8px; justify-content:center;
    text-align:center;
  }
  .spec-cell.winner{ color:var(--ok); }
  .spec-cell.winner svg{ width:15px; height:15px; flex-shrink:0; }
  .spec-cell .plain{ color:var(--text); }

  .empty-state, .loading-state{
    max-width:440px; margin:20px auto; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px 30px;
    color:var(--muted); font-size:14px;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">VELTRIX</div>
  <div class="nav-links">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'models' %}">Models</a>
    <a href="{% url 'compare' %}">Compare</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'contact' %}">Contact</a>
  </div>
  <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
</nav>

<div class="page">
  <div class="header">
    <p class="eyebrow">Head to Head</p>
    <h1>Compare cars.</h1>
    <p>Pick any two cars from our lineup and see exactly how they stack up.</p>
  </div>

  <div id="loadingState" class="loading-state">Loading cars…</div>

  <div id="pickerArea" style="display:none;">
    <div class="picker-row">
      <div class="picker">
        <label>Car 1</label>
        <select id="car1Select"></select>
      </div>
      <div class="vs-badge">VS</div>
      <div class="picker">
        <label>Car 2</label>
        <select id="car2Select"></select>
      </div>
    </div>

    <div class="compare-btn-row">
      <button type="button" class="compare-btn" id="compareBtn">Compare Now</button>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="cars-header" id="carsHeader"></div>
    <div class="spec-table" id="specTable"></div>
  </div>
</div>

<script>
  const CAR_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><circle cx="6.5" cy="18.5" r="1.5"/><circle cx="17.5" cy="18.5" r="1.5"/></svg>`;
  const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

  let cars = [];

  async function loadCars(){
    try{
      const res = await fetch('/cars/');
      cars = await res.json();

      const s1 = document.getElementById('car1Select');
      const s2 = document.getElementById('car2Select');
      cars.forEach((c, i) => {
        s1.add(new Option(`${c.brand} ${c.name}`, i));
        s2.add(new Option(`${c.brand} ${c.name}`, i));
      });
      if(cars.length > 1) s2.selectedIndex = 1;

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('pickerArea').style.display = 'block';
    } catch(err){
      document.getElementById('loadingState').textContent = 'Could not load cars. Please refresh.';
    }
  }
  loadCars();

  function specRow(label, c1, c2, unit, higherIsBetter){
    let c1win = false, c2win = false;
    if(higherIsBetter !== null){
      const v1 = parseFloat(c1), v2 = parseFloat(c2);
      if(v1 !== v2){
        if(higherIsBetter){ c1win = v1 > v2; c2win = v2 > v1; }
        else{ c1win = v1 < v2; c2win = v2 < v1; }
      }
    }
    return `
      <div class="spec-row">
        <div class="spec-label-row">${label}</div>
        <div class="spec-cell ${c1win ? 'winner' : ''}">${c1win ? CHECK_ICON : ''}<span>${c1}${unit}</span></div>
        <div class="spec-cell ${c2win ? 'winner' : ''}">${c2win ? CHECK_ICON : ''}<span>${c2}${unit}</span></div>
      </div>`;
  }

  document.getElementById('compareBtn').addEventListener('click', () => {
    const i1 = document.getElementById('car1Select').value;
    const i2 = document.getElementById('car2Select').value;
    const c1 = cars[i1], c2 = cars[i2];

    document.getElementById('carsHeader').innerHTML = `
      <div class="car-head">
        <div class="thumb">${CAR_ICON}</div>
        <div class="brand">${c1.brand}</div>
        <div class="name">${c1.name}</div>
      </div>
      <div class="car-head">
        <div class="thumb">${CAR_ICON}</div>
        <div class="brand">${c2.brand}</div>
        <div class="name">${c2.name}</div>
      </div>`;

    document.getElementById('specTable').innerHTML =
      specRow('Price', c1.price, c2.price, ' L', false) +
      specRow('Mileage', c1.mileage, c2.mileage, ' km/l', true) +
      specRow('Top Speed', c1.top_speed, c2.top_speed, ' km/h', true) +
      specRow('Seating Capacity', c1.seating_capacity, c2.seating_capacity, ' seats', true) +
      specRow('Fuel Type', c1.fuel_type, c2.fuel_type, '', null) +
      specRow('Purpose', c1.purpose, c2.purpose, '', null);

    document.getElementById('resultWrap').classList.add('show');
  });
</script>

</body>
</html>
